name: Publish the docs

# Builds the documentation site (mkdocs.yml, docs/ and the code's docstrings)
# and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://nmfs-ost.github.io/AA-SI_aalibrary/. It runs on every push to main
# that changes the docs or the code, and from the Actions tab
# (Publish the docs > Run workflow). Nothing needs to be installed anywhere:
# the docs are read from the source, without installing aalibrary.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write   # to push the gh-pages branch

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out, with history (pages show when they last changed)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MkDocs and its plugins
        run: >-
          pip install mkdocs mkdocs-material mkdocstrings-python
          mkdocs-git-revision-date-localized-plugin mkdocs-open-in-new-tab

      - name: Build and publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
